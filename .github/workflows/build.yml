name: Build Virgo kernel

on:
  workflow_dispatch:
    inputs:
      extra_make_args:
        description: Extra make arguments
        required: false
        default: ""

permissions:
  contents: read

env:
  ARCH: arm
  SUBARCH: arm
  TOOLCHAIN_URL: https://developer.arm.com/-/cdn-downloads/permalink/legacy-linaro-gnu-toolchains/5.1-2015.08/gcc-linaro-5.1-2015.08-x86_64_arm-linux-gnueabi.tar.xz
  TOOLCHAIN_DIR: /opt/toolchain/gcc-linaro-5.1-2015.08-x86_64_arm-linux-gnueabi
  TOOLCHAIN_PREFIX: /opt/toolchain/gcc-linaro-5.1-2015.08-x86_64_arm-linux-gnueabi/bin/arm-linux-gnueabi-
  KERNEL_LOCALVERSION: -PowerBy_Cancro-SU-Lab_${{ github.run_number }}
  TZ: Asia/Shanghai
  EXTRA_MAKE_ARGS: ${{ inputs.extra_make_args }}

jobs:
  build:
    name: Build virgo_defconfig
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout kernel
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Set build directories
        run: |
          echo "OUT_DIR=$RUNNER_TEMP/virgo-out" >> "$GITHUB_ENV"
          echo "ARTIFACT_DIR=$RUNNER_TEMP/virgo-artifacts" >> "$GITHUB_ENV"
          echo "CCACHE_DIR=$RUNNER_TEMP/virgo-ccache" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex git libssl-dev python3 xz-utils

      - name: Restore ccache
        uses: actions/cache@v5
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-${{ github.ref_name }}-virgo-linaro-gcc-5.1-2015.08-${{ hashFiles('arch/arm/configs/virgo_defconfig', '.github/boot.img', '.github/workflows/build.yml') }}
          restore-keys: |
            ccache-${{ runner.os }}-${{ github.ref_name }}-virgo-linaro-gcc-5.1-2015.08-
            ccache-${{ runner.os }}-virgo-linaro-gcc-5.1-2015.08-

      - name: Configure ccache
        run: |
          mkdir -p "$CCACHE_DIR"
          ccache --set-config=max_size=5G
          ccache --set-config=compiler_check=content
          ccache --zero-stats

      - name: Download and extract Linaro GCC 5.1.1
        run: |
          sudo install -d -o "$USER" -g "$(id -gn)" /opt/toolchain
          TOOLCHAIN_ARCHIVE="$RUNNER_TEMP/gcc-linaro-5.1-2015.08.tar.xz"
          curl -L --fail --connect-timeout 30 --max-time 300 "$TOOLCHAIN_URL" -o "$TOOLCHAIN_ARCHIVE"
          tar -xJf "$TOOLCHAIN_ARCHIVE" -C /opt/toolchain
          test -x "${TOOLCHAIN_PREFIX}gcc"
          "${TOOLCHAIN_PREFIX}gcc" --version
          echo "$TOOLCHAIN_DIR/bin" >> "$GITHUB_PATH"

      - name: Configure kernel
        run: |
          mkdir -p "$OUT_DIR"
          EXTRA_ARGS=()
          if [ -n "$EXTRA_MAKE_ARGS" ]; then
            read -r -a EXTRA_ARGS <<< "$EXTRA_MAKE_ARGS"
          fi
          MAKE_ARGS=(
            O="$OUT_DIR"
            ARCH="$ARCH"
            SUBARCH="$SUBARCH"
            CROSS_COMPILE="ccache $TOOLCHAIN_PREFIX"
            HOSTCFLAGS="-fcommon"
            LOCALVERSION="$KERNEL_LOCALVERSION"
          )
          make "${MAKE_ARGS[@]}" "${EXTRA_ARGS[@]}" virgo_defconfig
          make "${MAKE_ARGS[@]}" "${EXTRA_ARGS[@]}" silentoldconfig

      - name: Build kernel
        run: |
          EXTRA_ARGS=()
          if [ -n "$EXTRA_MAKE_ARGS" ]; then
            read -r -a EXTRA_ARGS <<< "$EXTRA_MAKE_ARGS"
          fi
          MAKE_ARGS=(
            O="$OUT_DIR"
            ARCH="$ARCH"
            SUBARCH="$SUBARCH"
            CROSS_COMPILE="ccache $TOOLCHAIN_PREFIX"
            HOSTCFLAGS="-fcommon"
            LOCALVERSION="$KERNEL_LOCALVERSION"
          )
          make -j"$(nproc)" "${MAKE_ARGS[@]}" "${EXTRA_ARGS[@]}"
          KERNEL_RELEASE="$(make -s "${MAKE_ARGS[@]}" "${EXTRA_ARGS[@]}" kernelrelease)"
          echo "KERNEL_RELEASE=$KERNEL_RELEASE" >> "$GITHUB_ENV"

      - name: Replace zImage in boot image
        run: |
          IMAGE_PATH="$OUT_DIR/arch/arm/boot/zImage"
          TEMPLATE_IMAGE=".github/boot.img"
          BOOT_IMAGE="$ARTIFACT_DIR/boot-virgo-${KERNEL_RELEASE}-${GITHUB_RUN_NUMBER}.img"
          test -s "$IMAGE_PATH"
          test -s "$TEMPLATE_IMAGE"
          python3 - "$TEMPLATE_IMAGE" "$IMAGE_PATH" "$BOOT_IMAGE" <<'PY'
          from hashlib import sha1, sha256
          from pathlib import Path
          from struct import pack, pack_into, unpack_from
          from sys import argv

          template_path, kernel_path, output_path = map(Path, argv[1:])
          boot_image = template_path.read_bytes()
          kernel_image = kernel_path.read_bytes()

          if len(boot_image) < 608 or boot_image[:8] != b"ANDROID!":
              raise SystemExit(f"Invalid Android boot image: {template_path}")
          if len(kernel_image) < 0x28 or unpack_from("<I", kernel_image, 0x24)[0] != 0x016F2818:
              raise SystemExit(f"Invalid ARM zImage: {kernel_path}")

          read_u32 = lambda offset: unpack_from("<I", boot_image, offset)[0]
          sizes = {
              "kernel": read_u32(8),
              "ramdisk": read_u32(16),
              "second": read_u32(24),
              "dt": read_u32(40),
          }
          page_size = read_u32(36)
          if page_size < 608 or page_size & (page_size - 1):
              raise SystemExit(f"Invalid boot page size: {page_size}")
          if len(boot_image) < page_size:
              raise SystemExit("Truncated Android boot header")

          align = lambda size: (size + page_size - 1) // page_size * page_size
          segments = {}
          offset = page_size
          for name in ("kernel", "ramdisk", "second", "dt"):
              size = sizes[name]
              segments[name] = boot_image[offset:offset + size]
              if len(segments[name]) != size:
                  raise SystemExit(f"Truncated boot image segment: {name}")
              offset += align(size)
          if offset != len(boot_image):
              raise SystemExit("Unsupported legacy boot image layout")

          def boot_id(parts):
              digest = sha1()
              for part in parts:
                  digest.update(part)
                  digest.update(pack("<I", len(part)))
              return digest.digest()

          include_dt = None
          for hash_dt in (True, False):
              if sizes["dt"] and not hash_dt:
                  continue
              names = ("kernel", "ramdisk", "second") + (("dt",) if hash_dt else ())
              if boot_id(segments[name] for name in names) == boot_image[576:596]:
                  include_dt = hash_dt
                  break
          if include_dt is None:
              raise SystemExit("Original boot image SHA-1 does not match its segments")

          header = bytearray(boot_image[:page_size])
          pack_into("<I", header, 8, len(kernel_image))
          segments["kernel"] = kernel_image
          names = ("kernel", "ramdisk", "second") + (("dt",) if include_dt else ())
          header[576:608] = boot_id(segments[name] for name in names) + bytes(12)

          def pad(segment):
              return segment + bytes(align(len(segment)) - len(segment))

          new_image = bytes(header) + b"".join(pad(segments[name]) for name in ("kernel", "ramdisk", "second", "dt"))
          output_path.parent.mkdir(parents=True, exist_ok=True)
          output_path.write_bytes(new_image)
          print(f"Created {output_path} ({len(new_image)} bytes)")
          print(f"SHA-256: {sha256(new_image).hexdigest()}")
          PY
          test -s "$BOOT_IMAGE"
          echo "BOOT_IMAGE=$BOOT_IMAGE" >> "$GITHUB_ENV"

      - name: Show ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: virgo-${{ github.run_number }}
          path: ${{ env.BOOT_IMAGE }}
          archive: false
          if-no-files-found: error
          retention-days: 30
